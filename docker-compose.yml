# Eine Anwendung, kein zweiter Dienst. Auf dem Entwicklungsserver baut
# Ludgers deploy-app.sh das Image aus dem Dockerfile (docs/betrieb.md).
services:
  materialpool:
    build: .
    restart: unless-stopped
    ports:
      - '8080:3000'
    volumes:
      # Der Spiegel schreibt seinen Stand nach daten/; ohne Volume wäre er
      # nach jedem Neustart des Containers weg. Der Container läuft als
      # node (uid 1000): ./daten muss für ihn beschreibbar sein
      # (docs/betrieb.md).
      - ./daten:/app/daten
    environment:
      RELAYS: ${RELAYS}
      QUELLE_AUTOREN: ${QUELLE_AUTOREN:-}
      QUELLE_VORRANG: ${QUELLE_VORRANG:-}
      SPIEGEL_PFAD: ${SPIEGEL_PFAD:-}
      SPIEGEL_INTERVALL_S: ${SPIEGEL_INTERVALL_S:-}
      SPIEGEL_STARTWARTEZEIT_S: ${SPIEGEL_STARTWARTEZEIT_S:-}
      SPIEGEL_LIMIT: ${SPIEGEL_LIMIT:-}
      HOST: 0.0.0.0
      PORT: '3000'
      # Öffentliche Adresse, sonst lehnt SvelteKit POST-Formulare ab
      # (.env.example, docs/betrieb.md). Lokal: der Port oben.
      ORIGIN: ${ORIGIN:-http://localhost:8080}
